<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="layout-cart.css">
  <title>Cardapio - Japan</title>
</head>

<body>
  <header>
    <a href="categorias.html"><img src="img/voltar.png" alt="voltar"></a>
        <h2>Carrinho</h2>
    <a href = "#"><img id="logo" src="img/logo-img.png" alt="logo"></a>
  </header>
  
  <main class="pratos" id="listaCarrinho"></main>
  
  <aside>
    <h2>Informações importantes</h2>
    <form>
      <input class="input-nome" type="text" placeholder="Seu nome">
      <div class="container-checkbox">
          
          <div class="checks">
            <input type="radio">
           <p>Retirada</p>
          </div>
          
          <div class="checks">
            <input type="radio">
           <p>Entrega</p>
          </div>          
          
          <input class="input-adress" type="text" placeholder="Endereço">
      </div>
      <input class="input-observacoes" type="text" placeholder="OBS: troco, retirar ingrediente...">
      <button>Enviar pedido</button>
    </form>
  </aside>
  
  <footer>
    <div class="menu-footer"><a href="cardapio.html">
      <img src="img/home-gray.png" alt="home">
      <h4>Inicio</h4></a>
    </div>
    
    <div class="menu-footer"><a href="Categorias.html">
      <img src="img/categoria-gray.png" alt="categoria">
      <h4>Categorias</h4></a>
    </div>
    
    <div class="menu-footer"><a href="contato.html">
      <img src="img/contato-gray.png" alt="Contato">
      <h4>Contato</h4></a>
    </div>
  </footer>
  
  <script>
document.addEventListener("DOMContentLoaded", () => {
  const listaCarrinho = document.getElementById("listaCarrinho");
  const carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

  if (carrinho.length === 0) {
    listaCarrinho.innerHTML = "<p>Seu carrinho está vazio 😔</p>";
    return;
  }

  // Cria os elementos de cada item
  carrinho.forEach(item => {
    const section = document.createElement("section");
    section.classList.add("container-pratos");
    
    section.innerHTML = `
      <div class="img-pratos">
        <img src="${item.imagem}" alt="${item.nome}">
        <h2>${item.nome}</h2>
      </div>

      <div class="preco">
        <p>R$<span>${item.preco}</span></p>
      </div>

      <div class="btn-mais">
        <button class="menos">-</button>
        <p><strong>${item.quantidade}</strong></p>
        <button class="mais">+</button>
      </div>
    `;

    listaCarrinho.appendChild(section);
  });

  // Atualiza quantidades no carrinho
  listaCarrinho.addEventListener("click", (e) => {
    if (e.target.classList.contains("mais") || e.target.classList.contains("menos")) {
      const nome = e.target.closest(".container-pratos").querySelector("h2").innerText;
      const carrinhoAtual = JSON.parse(localStorage.getItem("carrinho")) || [];

      const item = carrinhoAtual.find(i => i.nome === nome);
      if (!item) return;

      if (e.target.classList.contains("mais")) {
        item.quantidade += 1;
      } else if (e.target.classList.contains("menos") && item.quantidade > 1) {
        item.quantidade -= 1;
      } else if (e.target.classList.contains("menos") && item.quantidade === 1) {
        // remove o item do carrinho
        const index = carrinhoAtual.findIndex(i => i.nome === nome);
        carrinhoAtual.splice(index, 1);
      }

      // salva de volta
      localStorage.setItem("carrinho", JSON.stringify(carrinhoAtual));
      location.reload(); // recarrega pra atualizar visual
    }
  });
});
</script>

</body>

</html>
