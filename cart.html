<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="layout-cart.css">
  <title>Cardapio - Japan</title>
</head>

<body>
  <header>
    <a href="categorias.html"><img src="img/voltar.png" alt="voltar"></a>
        <h2>Carrinho</h2>
    <a href = "#"><img id="logo" src="img/logo-img.png" alt="logo"></a>
  </header>
  
  <main class="pratos">
    
 <!--ITEM 1 CARRINHO-->   
    <section class="container-pratos">
       <div class="img-pratos">
         <img src="img/img1.jpeg" alt="img-prato">
          <h2>Sushi</h2>
       </div>
       
       <div class="preco">
           <P>R$<span>25.99</span></P>
       </div>
       
       <div class="btn-mais">
            <button>-</button>
            <p><strong>1</strong></p>
            <button>+</button>
       </div>
    </section>
  </main>
  
  <aside>
    <h2>Informações importantes</h2>
    <form>
      <input class="input-nome" type="text" placeholder="Seu nome">
      <div class="container-checkbox">
          
          <div class="checks">
            <input type="radio">
           <p>Retirada</p>
          </div>
          
          <div class="checks">
            <input type="radio">
           <p>Entrega</p>
          </div>          
          
          <input class="input-adress" type="text" placeholder="Endereço">
      </div>
      <input class="input-observacoes" type="text" placeholder="OBS: troco, retirar ingrediente...">
      <button>Enviar pedido</button>
    </form>
  </aside>
  
  <footer>
    <div class="menu-footer"><a href="cardapio.html">
      <img src="img/home-gray.png" alt="home">
      <h4>Inicio</h4></a>
    </div>
    
    <div class="menu-footer"><a href="Categorias.html">
      <img src="img/categoria-gray.png" alt="categoria">
      <h4>Categorias</h4></a>
    </div>
    
    <div class="menu-footer"><a href="contato.html">
      <img src="img/contato-gray.png" alt="Contato">
      <h4>Contato</h4></a>
    </div>
  </footer>
</body>

</html>
