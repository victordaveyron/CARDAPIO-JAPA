<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="layout-cart.css">
  <title>Cardapio - Japan</title>
</head>

<body>
  <header>
    <a href="javascript:history.back()"><img src="img/voltar.png" alt="voltar"></a>
    <h2>Carrinho</h2>
    <a href="#"><img id="logo" src="img/logo-img.png" alt="logo"></a>
  </header>

  <main class="pratos" id="listaCarrinho"></main>

  <div class="total-container">
    <h2>Total: R$ <span id="valorTotal">0.00</span></h2>
  </div>

  <aside>
    <h2>Informações importantes</h2>
    <form>
      <input class="input-nome" type="text" placeholder="Seu nome">

      <div class="container-checkbox">

        <div class="checks">
          <input type="radio" name="tipoEntrega" value="retirada">
          <p>Retirada</p>
        </div>

        <div class="checks">
          <input type="radio" name="tipoEntrega" value="entrega">
          <p>Entrega</p>
        </div>

        <input class="input-adress" type="text" placeholder="Endereço">

        <!-- 🔥 NOVO BLOCO: Forma de pagamento -->
        <div class="pagamento-container">
          <h3>Formas de pagamento</h3>

          <div class="pagamento-opcoes">

            <label class="btn-pagamento">
              <input type="radio" name="formaPagamento" value="pix">
              <span>Pix</span>
            </label>

            <label class="btn-pagamento">
              <input type="radio" name="formaPagamento" value="dinheiro">
              <span>Dinheiro</span>
            </label>

            <label class="btn-pagamento">
              <input type="radio" name="formaPagamento" value="debito">
              <span>Débito</span>
            </label>

            <label class="btn-pagamento">
              <input type="radio" name="formaPagamento" value="credito">
              <span>Crédito</span>
            </label>

          </div>
        </div>
        <!-- 🔥 FIM DO BLOCO NOVO -->

      </div>

      <input class="input-observacoes" type="text" placeholder="OBS: troco, retirar ingrediente...">

      <button id="btn-enviar-pedido" class="btn-enviar">Enviar pedido</button>
    </form>
  </aside>

  <footer>
    <div class="menu-footer"><a href="cardapio.html">
        <img src="img/home-gray.png" alt="home">
        <h4>Inicio</h4>
      </a>
    </div>

    <div class="menu-footer"><a href="Categorias.html">
        <img src="img/categoria-gray.png" alt="categoria">
        <h4>Categorias</h4>
      </a>
    </div>

    <div class="menu-footer"><a href="contato.html">
        <img src="img/contato-gray.png" alt="Contato">
        <h4>Contato</h4>
      </a>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="enviarWhats.js"></script>

</body>

</html>
